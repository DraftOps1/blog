<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="API VIP and control plane failure path">
  <defs>
    <style>
      .bg{fill:#0f172a}.box{fill:#111827;stroke:#94a3b8;stroke-width:2;rx:12}.ok{stroke:#22c55e}.warn{stroke:#f59e0b}.bad{stroke:#ef4444}.txt{font-family:Inter,Arial,sans-serif;fill:#e5e7eb;font-size:24px}.small{font-size:18px;fill:#cbd5e1}.label{font-size:16px;fill:#94a3b8}.arrow{stroke:#cbd5e1;stroke-width:3;marker-end:url(#arrow)}.redarrow{stroke:#ef4444;stroke-width:3;marker-end:url(#arrow-red)}.green{fill:#22c55e}.yellow{fill:#f59e0b}.red{fill:#ef4444}.blue{fill:#38bdf8}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <text x="50" y="54" class="txt" font-size="30">GPUノード追加前に見つかった API 経路の異常</text>
  <text x="50" y="84" class="small">最初はGPUノード側のネットワークを疑ったが、既存control-plane側でもAPI VIPに到達できなかった。</text>

  <rect class="box ok" x="55" y="160" width="180" height="96"/>
  <text x="85" y="202" class="txt">GPU node</text>
  <text x="85" y="230" class="small">join 予定ノード</text>

  <rect class="box bad" x="310" y="145" width="190" height="126"/>
  <text x="344" y="188" class="txt">API VIP</text>
  <text x="342" y="216" class="small">最初は未応答</text>
  <text x="342" y="242" class="small">ARP / TCP NG</text>

  <rect class="box warn" x="575" y="145" width="210" height="126"/>
  <text x="614" y="188" class="txt">kube-vip</text>
  <text x="604" y="216" class="small">本来はVIP保持</text>
  <text x="604" y="242" class="small">Leaseで制御</text>

  <rect class="box warn" x="860" y="145" width="250" height="126"/>
  <text x="900" y="188" class="txt">kube-apiserver</text>
  <text x="900" y="216" class="small">TCPは戻っても</text>
  <text x="900" y="242" class="small">readyz failed</text>

  <rect class="box bad" x="860" y="355" width="250" height="100"/>
  <text x="928" y="396" class="txt">etcd</text>
  <text x="900" y="424" class="small">readyz: etcd failed</text>

  <rect class="box bad" x="575" y="355" width="210" height="100"/>
  <text x="620" y="396" class="txt">kubelet</text>
  <text x="602" y="424" class="small">static Pod管理不可</text>

  <rect class="box bad" x="310" y="355" width="190" height="100"/>
  <text x="350" y="396" class="txt">containerd</text>
  <text x="334" y="424" class="small">CRI plugin error</text>

  <line x1="235" y1="208" x2="310" y2="208" class="redarrow"/>
  <line x1="500" y1="208" x2="575" y2="208" class="arrow"/>
  <line x1="785" y1="208" x2="860" y2="208" class="arrow"/>
  <line x1="985" y1="271" x2="985" y2="355" class="redarrow"/>
  <line x1="860" y1="405" x2="785" y2="405" class="redarrow"/>
  <line x1="575" y1="405" x2="500" y2="405" class="redarrow"/>

  <text x="68" y="318" class="label">復旧の入口</text>
  <text x="315" y="318" class="label">一時VIPで疎通だけ戻した</text>
  <text x="575" y="318" class="label">根本原因はさらに下</text>
  <text x="760" y="500" class="small">今回の主因: containerd設定不整合によりCRIがロードされず、kubeletがstatic Podを正常管理できなかった。</text>
</svg>
