<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Storage option decision matrix">
  <defs><style>.bg{fill:#0f172a}.txt{font-family:Inter,Arial,sans-serif;fill:#e5e7eb;font-size:22px}.small{font-size:16px;fill:#cbd5e1}.head{fill:#1e293b}.row{fill:#111827}.alt{fill:#0b1220}.grid{stroke:#334155;stroke-width:1}.sel{fill:#0f3b2e;stroke:#22c55e;stroke-width:2}.bar{fill:#38bdf8}.bar2{fill:#22c55e}.warn{fill:#f59e0b}</style></defs>
  <rect class="bg" width="1200" height="680"/>
  <text x="50" y="55" class="txt" font-size="30">Longhorn保存先をどう増やすか</text>
  <text x="50" y="86" class="small">容量だけでなく、root圧迫回避・作業リスク・今後の拡張性で比較した。</text>
  <g transform="translate(50,130)">
    <rect class="head" width="1100" height="48"/><text x="20" y="31" class="txt">選択肢</text><text x="370" y="31" class="txt">容量</text><text x="500" y="31" class="txt">root分離</text><text x="660" y="31" class="txt">リスク</text><text x="790" y="31" class="txt">即効性</text><text x="930" y="31" class="txt">判断</text>
    <g transform="translate(0,48)"><rect class="row" width="1100" height="72"/><text x="20" y="43" class="txt">何もしない</text><rect x="360" y="26" width="25" height="16" class="bar"/><rect x="500" y="26" width="25" height="16" class="bar"/><rect x="650" y="26" width="125" height="16" class="bar2"/><rect x="790" y="26" width="125" height="16" class="bar2"/><text x="930" y="43" class="small">degradedは残る</text></g>
    <g transform="translate(0,120)"><rect class="alt" width="1100" height="72"/><text x="20" y="43" class="txt">root LV拡張</text><rect x="360" y="26" width="50" height="16" class="bar"/><rect x="500" y="26" width="50" height="16" class="bar"/><rect x="650" y="26" width="75" height="16" class="warn"/><rect x="790" y="26" width="75" height="16" class="warn"/><text x="930" y="43" class="small">root依存は残る</text></g>
    <g transform="translate(0,192)"><rect class="sel" width="1100" height="72"/><text x="20" y="43" class="txt">worker2に2TB SSD追加</text><rect x="360" y="26" width="125" height="16" class="bar2"/><rect x="500" y="26" width="100" height="16" class="bar2"/><rect x="650" y="26" width="75" height="16" class="warn"/><rect x="790" y="26" width="100" height="16" class="bar2"/><text x="930" y="43" class="small">今回選択</text></g>
    <g transform="translate(0,264)"><rect class="alt" width="1100" height="72"/><text x="20" y="43" class="txt">GPUノードもstorage化</text><rect x="360" y="26" width="75" height="16" class="bar"/><rect x="500" y="26" width="75" height="16" class="bar"/><rect x="650" y="26" width="50" height="16" class="warn"/><rect x="790" y="26" width="75" height="16" class="warn"/><text x="930" y="43" class="small">compute方針と衝突</text></g>
    <g transform="translate(0,336)"><rect class="row" width="1100" height="72"/><text x="20" y="43" class="txt">NAS / NFSへ逃がす</text><rect x="360" y="26" width="100" height="16" class="bar"/><rect x="500" y="26" width="125" height="16" class="bar2"/><rect x="650" y="26" width="50" height="16" class="warn"/><rect x="790" y="26" width="50" height="16" class="warn"/><text x="930" y="43" class="small">別設計が必要</text></g>
  </g>
  <text x="70" y="610" class="small">注: 厳密なベンチマークではなく、今回のhomelabでの意思決定メモとしての比較。</text>
</svg>
